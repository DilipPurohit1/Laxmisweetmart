<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGradRaisin" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#223315"/>
      <stop offset="100%" stop-color="#0B1306"/>
