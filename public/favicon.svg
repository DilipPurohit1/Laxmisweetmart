<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Royal Maroon Radial Gradient -->
    <radialGradient id="maroonGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8B1E2E" />
      <stop offset="70%" stop-color="#6E1824" />
      <stop offset="100%" stop-color="#420B13" />
    </radialGradient>

    <!-- Shimmering 24k Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="25%" stop-color="#F5D070" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA8018" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Drop Shadow for crisp elevation -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Royal Seal -->
  <rect 
    x="8" 
    y="8" 
    width="112" 
    height="112" 
    rx="28" 
    fill="url(#maroonGrad)" 
    stroke="url(#goldGrad)" 
    stroke-width="4.5"
    filter="url(#badgeShadow)"
  />

  <!-- Inner Delicate Golden Filigree Ring -->
  <rect 
    x="15" 
    y="15" 
    width="98" 
    height="98" 
    rx="21" 
    fill="none" 
    stroke="url(#goldGrad)" 
    stroke-width="1.2" 
    stroke-dasharray="3 2"
    opacity="0.85"
  />

  <!-- 7 Arched Golden Stars -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <polygon points="32,40 33.2,43.2 36.5,43.3 33.8,45.3 34.8,48.5 32,46.6 29.2,48.5 30.2,45.3 27.5,43.3 30.8,43.2" />
    <polygon points="42,30 43.2,33.2 46.5,33.3 43.8,35.3 44.8,38.5 42,36.6 39.2,38.5 40.2,35.3 37.5,33.3 40.8,33.2" />
    <polygon points="53,23 54.2,26.2 57.5,26.3 54.8,28.3 55.8,31.5 53,29.6 50.2,31.5 51.2,28.3 48.5,26.3 51.8,26.2" />
    <!-- Apex Star -->
    <polygon points="64,19 65.5,22.8 69.5,23.0 66.2,25.4 67.5,29.2 64,26.9 60.5,29.2 61.8,25.4 58.5,23.0 62.5,22.8" />
    <polygon points="75,23 76.2,26.2 79.5,26.3 76.8,28.3 77.8,31.5 75,29.6 72.2,31.5 73.2,28.3 70.5,26.3 73.8,26.2" />
    <polygon points="86,30 87.2,33.2 90.5,33.3 87.8,35.3 88.8,38.5 86,36.6 83.2,38.5 84.2,35.3 81.5,33.3 84.8,33.2" />
    <polygon points="96,40 97.2,43.2 100.5,43.3 97.8,45.3 98.8,48.5 96,46.6 93.2,48.5 94.2,45.3 91.5,43.3 94.8,43.2" />
  </g>

  <!-- Iconic Devanagari श्री in Gleaming 24K Gold with Elevation -->
  <text
    x="64"
    y="80"
    font-family="'Rozha One', 'Noto Serif Devanagari', 'Mangal', 'Playfair Display', serif"
    font-size="52"
    font-weight="900"
    fill="url(#goldGrad)"
    text-anchor="middle"
    filter="url(#badgeShadow)"
  >
    श्री
  </text>

  <!-- Mini Gold Accent Ribbon / Estd Dot -->
  <circle cx="44" cy="98" r="2.5" fill="url(#goldGrad)" />
  <text
    x="64"
    y="101"
    font-family="'Plus Jakarta Sans', sans-serif"
    font-size="9"
    font-weight="800"
    letter-spacing="2"
    fill="url(#goldGrad)"
    text-anchor="middle"
  >
    ESTD 1985
  </text>
  <circle cx="84" cy="98" r="2.5" fill="url(#goldGrad)" />
</svg>
